<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Image Gallery</h1>

    <div class="gallery">
        <img src="smiling girl.jpg" alt="Image 1">
        <img src="musical boy.jpg" alt="Image 2">
        <img src="lotus.jpg" alt="Image 3">
        <img src="cactus.jpg" alt="Image 4">
        <img src="waterfall.jpg" alt="Image 5">
        <img src="parrot.jpg" alt="Image 6">
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-img" id="lightboxImg">
    </div>

    <script src="script.js"></script>
</body>
</html>
